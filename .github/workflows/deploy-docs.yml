# Publishes the docs site to the `gh-pages` branch, which GitHub Pages serves.
#
# It runs `pnpm deploy:docs` - the same script a person would run locally
# (scripts/deploy-docs.mjs) - so the steps live in one place. The script
# commits only when the build differs from what the branch already holds.
name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - 'stateRefDocs/**'
      - 'scripts/deploy-docs.mjs'
      - '.github/workflows/deploy-docs.yml'
  # A manual run from the Actions tab, for a deploy with no docs change.
  workflow_dispatch:

# Pushing to gh-pages needs write access to the repository contents.
permissions:
  contents: write

# Two deploys racing would push over each other; the later one waits.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Identify the committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - run: pnpm deploy:docs
