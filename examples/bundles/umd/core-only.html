<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>state-ref UMD — core 단독</title>
    <link rel="stylesheet" href="/page.css" />
  </head>
  <body>
    <h1>UMD — core 단독</h1>
    <p class="lead">코어 스크립트 하나만 로드한다.</p>
    <nav><a href="/">← 조합 목록</a></nav>
    <p>
      확인할 것: <code>stateRef</code>는 생기고
      <code>stateRefDraft</code>·<code>stateRefBatch</code> 전역은 생기지
      않는다.
    </p>

    <script src="/vendor/state-ref.umd.js"></script>

    <section>
      <h2>결과</h2>
      <dl id="panel"></dl>
    </section>

    <script>
      (function () {
        var panel = document.getElementById('panel');
        function row(id, label, value) {
          var dt = document.createElement('dt');
          dt.textContent = label;
          var dd = document.createElement('dd');
          // The id is what a harness reads; the label is what a person reads
          // (DC8-8-04). Addressing a row by its Korean text would make a
          // rewording break the harness rather than the page.
          dd.setAttribute('data-row', id);
          dd.textContent = String(value);
          panel.appendChild(dt);
          panel.appendChild(dd);
        }

        row('coreGlobal', 'typeof stateRef', typeof window.stateRef);
        row('draftGlobal', 'typeof stateRefDraft', typeof window.stateRefDraft);
        row('batchGlobal', 'typeof stateRefBatch', typeof window.stateRefBatch);

        var seen = [];
        var watch = window.stateRef.createStore({ count: 0 });
        watch(function (state) {
          seen.push(state.count.value);
        });
        var ref = watch();
        ref.count.value = 1;
        ref.count.value = 2;

        row('seen', '구독이 본 값', seen.join(' → '));
        row('count', '현재 count', ref.count.value);
        row('verdict', '판정', seen.length === 3 ? '쓰기마다 동기 알림 — 정상' : '예상과 다름');
      })();
    </script>
  </body>
</html>
